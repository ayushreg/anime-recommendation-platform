name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit and smoke tests
        run: pytest -q
        env:
          DATABASE_URL: sqlite+pysqlite:////tmp/anime_test.db
          REDIS_URL: redis://localhost:6379/0

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build
        run: |
          npm install
          npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Boot the whole stack
        run: docker compose up -d --build

      - name: Wait for the API to finish seeding
        # First boot downloads the offline catalog, which is not fast.
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8000/api/health | grep -q '"status"'; then
              echo "API is up"
              break
            fi
            sleep 10
          done
          curl -sf http://localhost:8000/api/health

      - name: Wait for the web app
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Web app is up"
              break
            fi
            sleep 5
          done

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Smoke the critical flows
        working-directory: frontend
        run: npm run test:e2e
        env:
          KURA_BASE_URL: http://localhost:3000
          CI: "true"

      - name: Upload the report when something breaks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: API logs on failure
        if: failure()
        run: docker compose logs --tail=200 api
