services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anime
      POSTGRES_PASSWORD: anime
      POSTGRES_DB: anime_recs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime -d anime_recs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://anime:anime@db:5432/anime_recs
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production-anime-recs-2025
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:80
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://anime:anime@db:5432/anime_recs
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./backend:/app
    command: python -m app.worker

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
