# Runs with no setup: `docker compose up`. Everything below has a default.
# To change a port or a secret, copy .env.example to .env and edit that; you
# should never need to edit this file.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anime}
      POSTGRES_DB: ${POSTGRES_DB:-anime_recs}
    # Deliberately not published to the host. Plenty of machines already have
    # something on 5432, and nothing outside this network needs it. To poke at
    # the database: docker compose exec db psql -U anime -d anime_recs
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anime} -d ${POSTGRES_DB:-anime_recs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    ports:
      - "${KURA_API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-anime}:${POSTGRES_PASSWORD:-anime}@db:5432/${POSTGRES_DB:-anime_recs}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-kura-local-dev-secret}
      CORS_ORIGINS: http://localhost:5173,http://localhost:${KURA_WEB_PORT:-3000},http://frontend:80
      KURA_FLAGS: ${KURA_FLAGS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-anime}:${POSTGRES_PASSWORD:-anime}@db:5432/${POSTGRES_DB:-anime_recs}
      REDIS_URL: redis://redis:6379/0
      KURA_FLAGS: ${KURA_FLAGS:-}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./backend:/app
    command: python -m app.worker

  frontend:
    build: ./frontend
    ports:
      - "${KURA_WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  pgdata:
